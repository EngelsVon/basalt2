        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install server deps
        working-directory: server
        run: npm ci --prefer-offline --no-audit

      - name: Initialize on-chain config (Config PDA)
        working-directory: server
        env:
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
          PROGRAM_ID: ${{ env.PROGRAM_ID }}
          SERVICE_FEE_WALLET: ${{ secrets.SERVICE_FEE_WALLET }}
          SERVICE_FEE_BPS: ${{ secrets.SERVICE_FEE_BPS }}
          MIN_CU_PRICE_MICROLAMPORTS: ${{ secrets.MIN_CU_PRICE_MICROLAMPORTS }}
          MIN_CU_LIMIT: ${{ secrets.MIN_CU_LIMIT }}
          DEPLOYER_KEYPAIR: $HOME/.config/solana/id.json
        run: |
          set -euxo pipefail
          # Fallbacks for private repo without secrets
          export SOLANA_RPC_URL="${SOLANA_RPC_URL:-https://api.devnet.solana.com}"
          export SERVICE_FEE_WALLET="${SERVICE_FEE_WALLET:-$(solana address)}"
          export SERVICE_FEE_BPS="${SERVICE_FEE_BPS:-100}"
          export MIN_CU_PRICE_MICROLAMPORTS="${MIN_CU_PRICE_MICROLAMPORTS:-20000}"
          export MIN_CU_LIMIT="${MIN_CU_LIMIT:-300000}"
          node scripts/init_config.js