# ci: retrigger push at 2025-09-12T07:32:00Z
name: Build SBF Program (Agave v3.0.1)

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Also deploy to Devnet and init on-chain config'
        required: false
        default: false
        type: boolean
  push:
    branches: [ main, master ]
    paths:
      - 'programs/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/build-sbf.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl ca-certificates pkg-config libssl-dev build-essential git

      - name: Install Rust toolchain (Cargo 1.95.0 (Rust 2024 compatible))
        shell: bash
        run: |
          set -euxo pipefail
          curl -fsSL --retry 6 --retry-all-errors --connect-timeout 15 https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" toolchain install 1.95.0 --profile minimal
          "$HOME/.cargo/bin/rustup" default 1.95.0
          "$HOME/.cargo/bin/cargo" --version

      - name: Install Solana toolchain v3.0.1 (with retry and fallback)
        env:
          SOLANA_VERSION: v3.0.1
        shell: bash
        run: |
          set -euxo pipefail
          INSTALL_OK=0
          # Try official installer with retries
          if curl -fsSL --retry 6 --retry-all-errors --connect-timeout 15 "https://release.anza.xyz/${SOLANA_VERSION}/install" | sh -s -; then
            INSTALL_OK=1
          else
            echo "[warn] Installer script failed, trying GitHub Releases fallback..."
            ARCH=$(uname -m)
            case "$ARCH" in
              x86_64) TARBALL="solana-release-x86_64-unknown-linux-gnu.tar.bz2" ;;
              aarch64) TARBALL="solana-release-aarch64-unknown-linux-gnu.tar.bz2" ;;
              *) echo "Unsupported arch: $ARCH"; exit 1 ;;
            esac
            TARBALL_URL="https://github.com/anza-xyz/agave/releases/download/${SOLANA_VERSION}/${TARBALL}"
            TMPDIR=$(mktemp -d)
            pushd "$TMPDIR"
            curl -fL --retry 6 --retry-all-errors --connect-timeout 15 -o solana.tar.bz2 "$TARBALL_URL"
            tar xjf solana.tar.bz2
            mkdir -p "$HOME/.local/share/solana/install/active_release"
            # Move extracted release into active_release
            mv solana-release/* "$HOME/.local/share/solana/install/active_release"
            popd
          fi
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
          # Sanity check installation (absolute path works within current step)
          ls -la "$HOME/.local/share/solana/install/active_release/bin" || true
          "$HOME/.local/share/solana/install/active_release/bin/solana" --version
          # Also try via PATH (effective next steps, but try anyway)
          solana --version || true

      - name: Show tool versions
        shell: bash
        run: |
          which solana || true
          which cargo || true
          solana --version
          cargo --version || true
          cargo-build-sbf --version || true

      - name: Build and test pinned SBF program
        shell: bash
        working-directory: programs/basalt_inscription
        run: |
          set -euo pipefail
          if [ ! -f Cargo.lock ]; then cargo generate-lockfile; fi
          cargo test --locked
          cargo-build-sbf --tools-version v1.57 -- --locked

      - name: Upload SBF artifacts
        uses: actions/upload-artifact@v4
        with:
          name: basalt_sbf_artifacts
          path: |
            programs/basalt_inscription/Cargo.lock
            target/deploy/*.so
            programs/basalt_inscription/target/deploy/*.so
          if-no-files-found: error

  deploy_devnet:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy }}
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: basalt_sbf_artifacts
          path: artifacts
      - name: Install pinned Solana CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 https://github.com/anza-xyz/agave/releases/download/v3.0.1/solana-release-x86_64-unknown-linux-gnu.tar.bz2 -o /tmp/solana.tar.bz2
          tar -xjf /tmp/solana.tar.bz2 -C /tmp
          echo /tmp/solana-release/bin >> "$GITHUB_PATH"
      - name: Validate persistent deployment keys and Devnet
        shell: bash
        env:
          PAYER_KEY: ${{ secrets.SOLANA_PAYER_KEYPAIR_JSON }}
          PROGRAM_KEY: ${{ secrets.SOLANA_PROGRAM_KEYPAIR_JSON }}
        run: |
          set -euo pipefail
          test -n "$PAYER_KEY" && test -n "$PROGRAM_KEY" || { echo 'Configure persistent payer and program key secrets before deployment'; exit 1; }
          umask 077
          mkdir -p "$HOME/.config/solana"
          printf '%s' "$PAYER_KEY" > "$HOME/.config/solana/id.json"
          printf '%s' "$PROGRAM_KEY" > "$HOME/.config/solana/program.json"
          PID=$(solana address -k "$HOME/.config/solana/program.json")
          grep -F "declare_id!(\"$PID\")" programs/basalt_inscription/src/lib.rs
          solana config set --url https://api.devnet.solana.com
          test "$(solana genesis-hash)" = 'EtWTRABZaYq6iMfeYKouRu166VU2xqa1wcaWoxPkrZBG'
          echo "PROGRAM_ID=$PID" >> "$GITHUB_ENV"
          solana balance
      - name: Deploy exact build artifact (never change program ID)
        shell: bash
        run: |
          set -euo pipefail
          SO=artifacts/programs/basalt_inscription/target/deploy/basalt_inscription.so
          test -f "$SO"
          solana program deploy "$SO" --program-id "$HOME/.config/solana/program.json" --url devnet --use-rpc
          solana program show "$PROGRAM_ID" --url devnet
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix server --ignore-scripts
      - name: Initialize config using deployment authority
        env:
          SOLANA_RPC_URL: https://api.devnet.solana.com
          SERVICE_FEE_WALLET: ${{ secrets.SERVICE_FEE_WALLET || '6TnyoYQzXqZV4Awu8kiUYX343MTAa7dTx7tLiBzcoT4Z' }}
          SERVICE_FEE_BPS: '50'
        run: node server/scripts/init_config.js
