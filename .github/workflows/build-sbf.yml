            solana-keygen new --no-bip39-passphrase --silent -o programs/output/basalt_inscription-keypair.json -f
            chmod 600 programs/output/basalt_inscription-keypair.json
            NEW_PID=$(solana address -k programs/output/basalt_inscription-keypair.json)
            echo "::warning::Using NEW PROGRAM_ID: $NEW_PID (declare_id in source may differ; proceeding in no-secrets mode)"
            # Update env for later steps
            echo "PROGRAM_ID=$NEW_PID" >> "$GITHUB_ENV"
            # Redeploy with new id (will exit on failure due to set -e)
            solana program deploy "$SO" --program-id programs/output/basalt_inscription-keypair.json
