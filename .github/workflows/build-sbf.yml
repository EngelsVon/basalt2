name: Build SBF Program (Solana v1.17.28)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'programs/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/build-sbf.yml'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq curl ca-certificates pkg-config libssl-dev build-essential git

      - name: Install Solana toolchain v1.17.28 (with retry and fallback)
        env:
          SOLANA_VERSION: v1.17.28
        shell: bash
        run: |
          set -euxo pipefail
          INSTALL_OK=0
          # Try official installer with retries
          if curl -fsSL --retry 6 --retry-all-errors --connect-timeout 15 "https://release.solana.com/${SOLANA_VERSION}/install" | sh -s -; then
            INSTALL_OK=1
          else
            echo "[warn] Installer script failed, trying GitHub Releases fallback..."
            ARCH=$(uname -m)
            case "$ARCH" in
              x86_64) TARBALL="solana-release-x86_64-unknown-linux-gnu.tar.bz2" ;;
              aarch64) TARBALL="solana-release-aarch64-unknown-linux-gnu.tar.bz2" ;;
              *) echo "Unsupported arch: $ARCH"; exit 1 ;;
            esac
            TARBALL_URL="https://github.com/solana-labs/solana/releases/download/${SOLANA_VERSION}/${TARBALL}"
            TMPDIR=$(mktemp -d)
            pushd "$TMPDIR"
            curl -fL --retry 6 --retry-all-errors --connect-timeout 15 -o solana.tar.bz2 "$TARBALL_URL"
            tar xjf solana.tar.bz2
            mkdir -p "$HOME/.local/share/solana/install/active_release"
            # Move extracted release into active_release
            mv solana-release/* "$HOME/.local/share/solana/install/active_release"
            popd
          fi
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
          # Sanity check installation
          ls -la "$HOME/.local/share/solana/install/active_release/bin"
          "$HOME/.local/share/solana/install/active_release/bin/solana" --version

      - name: Show tool versions
        shell: bash
        run: |
          which solana || true
          which cargo || true
          solana --version
          cargo --version
          cargo-build-sbf --version

      - name: Ensure ahash in lockfile is >= 0.8.7 (best-effort, using Solana cargo)
        shell: bash
        working-directory: programs/basalt_inscription
        run: |
          set -euxo pipefail
          # If a lockfile from a newer system cargo exists (v4), remove it so Solana's cargo can regenerate
          rm -f Cargo.lock
          SOL_CARGO="$HOME/.local/share/solana/install/active_release/bin/cargo"
          "$SOL_CARGO" --version
          # Try to pin ahash to 0.8.7 in the lockfile; fall back to a general update; never fail the job here
          "$SOL_CARGO" update -p ahash --precise 0.8.7 || "$SOL_CARGO" update -p ahash || true

      - name: Build basalt_inscription program (SBF)
        shell: bash
        working-directory: programs/basalt_inscription
        run: |
          # Use full path as fallback in case PATH update fails for any reason
          if ! command -v cargo-build-sbf >/dev/null 2>&1; then
            "$HOME/.local/share/solana/install/active_release/bin/cargo-build-sbf" -v
          else
            cargo-build-sbf -v
          fi

      - name: Upload SBF artifacts
        uses: actions/upload-artifact@v4
        with:
          name: basalt_sbf_artifacts
          path: |
            target/deploy/*.so
            target/deploy/*.json
            target/deploy/*.key
            programs/basalt_inscription/target/deploy/*.so
            programs/basalt_inscription/target/deploy/*.json
            programs/basalt_inscription/target/deploy/*.key
          if-no-files-found: error